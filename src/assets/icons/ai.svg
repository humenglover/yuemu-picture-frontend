<?xml version="1.0" standalone="no"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg class="icon" viewBox="-250 -250 1718 1718" version="1.1" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" style="background-color:transparent;">

    <style>
        .ai-core {
        fill: url(#cyber-gradient);
        filter: url(#neon-glow);
        transform-origin: center;
        /* 将浮动动画从 4s 延长到 8s，变得更缓慢平滑 */
        animation: float 8s ease-in-out infinite;
        }

        @keyframes float {
        0% { transform: translateY(0px) scale(1); filter: brightness(1) url(#neon-glow); }
        50% { transform: translateY(-25px) scale(1.02); filter: brightness(1.2) url(#neon-glow); }
        100% { transform: translateY(0px) scale(1); filter: brightness(1) url(#neon-glow); }
        }
    </style>

    <defs>
        <linearGradient id="cyber-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#00F2FE">
                <animate attributeName="stop-color" values="#00F2FE;#4FACFE;#00F2FE" dur="10s" repeatCount="indefinite" />
            </stop>
            <stop offset="50%" stop-color="#7000FF">
                <animate attributeName="stop-color" values="#7000FF;#F093FB;#7000FF" dur="10s" repeatCount="indefinite" />
            </stop>
            <stop offset="100%" stop-color="#FF007A">
                <animate attributeName="stop-color" values="#FF007A;#F5576C;#FF007A" dur="10s" repeatCount="indefinite" />
            </stop>
        </linearGradient>

        <filter id="neon-glow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur in="SourceGraphic" stdDeviation="15" result="blur1" />
            <feGaussianBlur in="SourceGraphic" stdDeviation="35" result="blur2" />
            <feGaussianBlur in="SourceGraphic" stdDeviation="60" result="blur3" />
            <feMerge>
                <feMergeNode in="blur3" />
                <feMergeNode in="blur2" />
                <feMergeNode in="blur1" />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>
    </defs>

    <g class="ai-core" transform="translate(0, 97)">
