<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 全局阴影 -->
    <filter id="plus-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#78350f" flood-opacity="0.15"/>
    </filter>
    
    <!-- 内部光晕 -->
    <filter id="plus-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="15" result="blur" />
    </filter>

    <!-- 背景玻璃渐变 -->
    <linearGradient id="plus-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#fffbeb" stop-opacity="0.4" />
    </linearGradient>

    <!-- 图标暗金渐变 -->
    <linearGradient id="plus-icon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- 边框高光 -->
    <linearGradient id="plus-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.2" />
    </linearGradient>
  </defs>

  <!-- 底部毛玻璃圆角矩形 -->
  <rect x="20" y="20" width="160" height="160" rx="42" fill="url(#plus-bg)" filter="url(#plus-shadow)"/>
  
  <!-- 边框高光层 -->
  <rect x="20" y="20" width="160" height="160" rx="42" fill="none" stroke="url(#plus-border)" stroke-width="2"/>

  <!-- 背景金色光晕 -->
  <circle cx="100" cy="85" r="40" fill="#f59e0b" opacity="0.25" filter="url(#plus-glow)"/>

  <!-- 皇冠主体图标 (Crown) -->
  <path d="M60 115 L48 65 L76 85 L100 48 L124 85 L152 65 L140 115 Z" fill="url(#plus-icon-grad)" stroke="url(#plus-icon-grad)" stroke-width="1" stroke-linejoin="round"/>
  
  <!-- 皇冠底座 -->
  <rect x="62" y="122" width="76" height="6" rx="3" fill="url(#plus-icon-grad)"/>

  <!-- 徽标文字 -->
  <text x="100" y="155" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="16" font-weight="800" fill="#d97706" text-anchor="middle" letter-spacing="3">PLUS</text>
</svg>
