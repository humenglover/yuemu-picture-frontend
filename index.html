  <!-- Prevent theme flash -->
  <script>
    (function () {
      try {
        var theme = localStorage.getItem('theme');
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (theme === 'dark' || (theme !== 'light' && prefersDark)) {
          document.documentElement.classList.add('dark-theme');
        }
      } catch (e) {}
    })();
  </script>

  <style>
    #app-loading {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10000;
    }
    .loader-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }
    .loader-orb {
      width: 80px;
      height: 80px;
      background: radial-gradient(circle at 30% 30%, #f0f9ff, #7dd3fc, #38bdf8);
      border-radius: 50%;
      filter: blur(10px);
      box-shadow: 0 0 50px rgba(56, 189, 248, 0.25);
      animation: orb-breathe 2.8s ease-in-out infinite;
      opacity: 0.8;
    }
    @keyframes orb-breathe {
      0%, 100% { transform: scale(0.9); opacity: 0.6; filter: blur(8px); }
      50% { transform: scale(1.1); opacity: 0.9; filter: blur(12px); }
    }
    .loader-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      font-size: 15px;
      font-weight: 500;
      color: #64748b;
      letter-spacing: 2px;
    }
    @media (prefers-color-scheme: dark) {
      #app-loading:not(.light-theme-forced) { background-color: #121212; }
      #app-loading:not(.light-theme-forced) .loader-orb {
        background: radial-gradient(circle at 30% 30%, #0f172a, #0369a1, #0ea5e9);
        box-shadow: 0 0 50px rgba(14, 165, 233, 0.2);
      }
      #app-loading:not(.light-theme-forced) .loader-text { color: #94a3b8; }
    }
    html.dark-theme #app-loading { background-color: #121212; }
    html.dark-theme .loader-orb {
      background: radial-gradient(circle at 30% 30%, #0f172a, #0369a1, #0ea5e9);
      box-shadow: 0 0 50px rgba(14, 165, 233, 0.2);
    }
    html.dark-theme .loader-text { color: #94a3b8; }
    html.light-theme #app-loading { background-color: #ffffff; }
    html.light-theme .loader-orb {
      background: radial-gradient(circle at 30% 30%, #f0f9ff, #7dd3fc, #38bdf8);
      box-shadow: 0 0 50px rgba(56, 189, 248, 0.25);
    }
    html.light-theme .loader-text { color: #64748b; }
  </style>
</head>

  <!-- Auto-remove loading screen -->
  <script>
    setTimeout(function() {
      var loading = document.getElementById('app-loading');
      if (loading) loading.remove();
    }, 999);
  </script>

  <!-- Locale-aware initial meta update BEFORE Vue mounts -->
  <script>
    (function() {
      try {
        var lang = localStorage.getItem('locale') || 'zh-CN';
        var el = document.getElementById('initial-loader-text');
        if (lang === 'en-US') {
          if (el) el.innerText = 'Opening yuemutuku...';
          document.documentElement.lang = 'en';
          document.title = 'yuemutuku - Discover, Share, Create Beautiful Moments';

          var _d = document.querySelector('meta[name="description"]');
          if (_d) _d.content = 'yuemutuku is a creative community platform gathering massive assets, where you can discover beautiful moments, share life, and interact with like-minded creators. Join us to share and create together.';

          var _k = document.querySelector('meta[name="keywords"]');
          if (_k) _k.content = 'yuemutuku, creative community, asset sharing, life recording, art inspiration, creator community, image sharing, design assets';

          var _a = document.querySelector('meta[name="author"]');
          if (_a) _a.content = 'yuemutuku Team';

          var _ot = document.querySelector('meta[property="og:title"]');
          if (_ot) _ot.content = 'yuemutuku - Discover, Share, Create Beautiful Moments';

          var _od = document.querySelector('meta[property="og:description"]');
          if (_od) _od.content = 'Discover beautiful moments, share life, and create together at yuemutuku.';

          var _tt = document.querySelector('meta[name="twitter:title"]');
          if (_tt) _tt.content = 'yuemutuku - Discover, Share, Create Beautiful Moments';

          var _td = document.querySelector('meta[name="twitter:description"]');
          if (_td) _td.content = 'Discover beautiful moments, share life, and create together at yuemutuku.';

          var _wl = document.querySelector('meta[property="wx:title"]');
          if (_wl) _wl.content = 'yuemutuku - Discover, Share, Create Beautiful Moments';

          var _wd = document.querySelector('meta[property="wx:description"]');
          if (_wd) _wd.content = 'Discover beautiful moments, share life, and create together at yuemutuku.';

          var _c = document.querySelector('link[rel="canonical"]');
          if (_c) _c.href = 'https://www.yuemutuku.com/?lang=en';

          var _alts = document.querySelectorAll('link[rel="alternate"]');
          _alts.forEach(function(link) {
            if (link.getAttribute('hreflang') === 'zh-CN') link.href = 'https://www.yuemutuku.com/';
            if (link.getAttribute('hreflang') === 'en-US') link.href = 'https://www.yuemutuku.com/?lang=en';
          });
        } else {
          if (el) el.innerText = '正在开启悦木图库...';
          document.documentElement.lang = 'zh-CN';
        }
      } catch (e) {}
    })();
  </script>
