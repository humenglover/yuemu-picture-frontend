  <script>
    (function () { try { var t = localStorage.getItem('theme'); var d = window.matchMedia('(prefers-color-scheme:dark)').matches; if (t === 'dark' || (t !== 'light' && d)) { document.documentElement.classList.add('dark-theme') } } catch (e) { } })();

  <style>
    #app-loading { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #fff; display: flex; align-items: center; justify-content: center; z-index: 10000 }
    .loader-orb { width: 80px; height: 80px; background: radial-gradient(circle at 30% 30%, #f0f9ff, #7dd3fc, #38bdf8); border-radius: 50%; filter: blur(10px); box-shadow: 0 0 50px rgba(56, 189, 248, .25); animation: orb-breathe 2.8s ease-in-out infinite; opacity: .8 }
    @keyframes orb-breathe { 0%, 100% { transform: scale(.9); opacity: .6; filter: blur(8px) } 50% { transform: scale(1.1); opacity: .9; filter: blur(12px) } }
    @media (prefers-color-scheme: dark) { #app-loading:not(.light-theme-forced) { background: #121212 } #app-loading:not(.light-theme-forced) .loader-orb { background: radial-gradient(circle at 30% 30%, #0f172a, #0369a1, #0ea5e9); box-shadow: 0 0 50px rgba(14, 165, 233, .2) } }
    html.dark-theme #app-loading { background: #121212 } html.dark-theme .loader-orb { background: radial-gradient(circle at 30% 30%, #0f172a, #0369a1, #0ea5e9); box-shadow: 0 0 50px rgba(14, 165, 233, .2) }
    html.light-theme #app-loading { background: #fff } html.light-theme .loader-orb { background: radial-gradient(circle at 30% 30%, #f0f9ff, #7dd3fc, #38bdf8); box-shadow: 0 0 50px rgba(56, 189, 248, .25) }
  </style>

  <script>
    setTimeout(function () { var l = document.getElementById('app-loading'); if (l) l.remove() }, 999);
  </script>

  <!-- Pre-boot: set <html lang> from URL locale prefix -->
  <script>
    (function(){try{var m=window.location.pathname.match(/^\/([a-z]{2})(\/|$)/);var L={zh:'zh-CN'};document.documentElement.lang=m?L[m[1]]||m[1]:'zh-CN'}catch(e){}})();
  </script>
